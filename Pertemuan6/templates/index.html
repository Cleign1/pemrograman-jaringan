<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Streaming</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <!-- Memanggil Bootstrap dari CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css"
        integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <script src="https://code.jquery.com/jquery-3.5.1.min.js"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="row">
            <div class="col-md-8 offset-md-2">
                <h2 class="text-center mb-4">Video Streaming</h2>
                <video id="videoPlayer" class="w-100" controls>
                    <source src="{{ url_for('static', filename='video/video1.mp4') }}" type="video/mp4">
                </video>
                <div class="mt-3">
                    <button id="playBtn" class="btn btn-primary mr-3">Play</button>
                    <button id="pauseBtn" class="btn btn-primary mr-3">Pause</button>
                    <button id="fullScreenBtn" class="btn btn-primary">Fullscreen</button>
                    <button id="muteBtn" class="btn btn-primary mr-3">Mute</button>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-md-8 offset-md-2 mt-5">
                <video id="videoPlayer2" class="w-100" controls>
                    <source src="{{ url_for('static', filename='video/video2.mp4') }}" type="video/mp4">
                </video>
                <div class="mt-3">
                    <button id="playBtn2" class="btn btn-primary mr-3">Play</button>
                    <button id="pauseBtn2" class="btn btn-primary mr-3">Pause</button>
                    <button id="fullScreenBtn2" class="btn btn-primary">Fullscreen</button>
                    <button id="muteBtn2" class="btn btn-primary mr-3">Mute</button>
                </div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/video.js') }}"></script>
    <script src="{{ url_for('static', filename='js/video2.js') }}"></script>
</body>
</html>
