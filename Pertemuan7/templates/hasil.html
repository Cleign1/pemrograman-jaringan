<!DOCTYPE html>
<html>
<head>
    <title>Hasil Tebakan</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet" />
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: 'Press Start 2P', cursive, monospace;
            background-color: #0b0c10;
            color: #66ff66;
            text-align: center;
            user-select: none;
            flex-direction: column;
            padding: 0;
        }
        p {
            font-size: 14px;
            margin-bottom: 30px;
            text-shadow:
                2px 2px 0 #000,
                -2px 2px 0 #000,
                2px -2px 0 #000,
                -2px -2px 0 #000;
        }
        a {
            display: inline-block;
            margin: 10px;
            padding: 15px 30px;
            text-decoration: none;
            color: #0b0c10;
            background-color: #ff4500;
            border: 3px solid #ffb347;
            box-shadow:
                inset 0 0 10px #ffb347,
                4px 4px 0 #000;
            border-radius: 0;
            font-size: 10px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: background-color 0.2s, color 0.2s;
            cursor: pointer;
            font-weight: bold;
            box-sizing: border-box;
        }
        a:hover {
            background-color: #ffb347;
            color: #0b0c10;
            box-shadow:
                inset 0 0 15px #ff4500,
                6px 6px 0 #000;
        }
        button {
            background: none;
            border: none;
            color: inherit;
            font: inherit;
            cursor: pointer;
            padding: 0;
            margin: 0;
            font-family: inherit;
            font-size: inherit;
            text-transform: inherit;
            letter-spacing: inherit;
        }
        * {
            image-rendering: pixelated;
        }
    </style>
</head>
<body>
    <p>{{ pesan }}</p>
    {% if attempts %}
    <p>Jumlah percobaan: {{ attempts }}</p>
    {% endif %}
    <a href="/">
        <button type="button">Coba lagi</button>
    </a>
    <br><br>
    <a href="/reset">
        <button type="button">Mulai ulang</button>
    </a>
</body>
</html>
